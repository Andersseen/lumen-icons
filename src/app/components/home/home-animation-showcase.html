<volt-card
  class="relative block overflow-hidden rounded-[1.75rem] border border-white/10 bg-[#10172a]/90 p-5 shadow-2xl shadow-black/30 backdrop-blur-xl sm:p-6"
  aria-label="Live icon animation preview"
  role="region"
>
  <div class="pointer-events-none absolute inset-x-0 top-0 h-24 bg-gradient-to-b from-primary/10 to-transparent" aria-hidden="true"></div>
  <div class="relative mb-6 flex items-start justify-between gap-4">
    <div>
      <p class="text-xs font-bold uppercase tracking-[0.2em] text-violet-300">Live component canvas</p>
      <h2 class="mt-2 text-xl font-semibold tracking-tight text-white">Motion with a purpose.</h2>
    </div>
    <span class="rounded-full border border-emerald-300/20 bg-emerald-300/10 px-2.5 py-1 text-[10px] font-bold uppercase tracking-wider text-emerald-200">CSS only</span>
  </div>

  <div class="relative grid grid-cols-2 gap-3 sm:grid-cols-3">
    @for (demo of demos; track demo.label) {
    <div
      class="group flex min-h-28 flex-col items-center justify-center gap-3 rounded-2xl border border-white/[0.09] bg-white/[0.035] px-3 py-4 transition-colors"
      [class]="demo.hoverClasses"
      [moveWhileHover]="{ scale: [1, 1.035], y: [0, -2] }"
      [moveWhileTap]="{ scale: [1, 0.98] }"
      [moveDuration]="180"
    >
      <div
        [class]="demo.colorClass"
        [move]="{ opacity: [0, 1], scale: [0.9, 1] }"
        [moveDuration]="260"
      >
        <ng-container
          [ngComponentOutlet]="demo.icon"
          [ngComponentOutletInputs]="{ size: 32, strokeWidth: 1.5, animate: demo.animate }"
        />
      </div>
      <code class="text-[10px] font-mono text-slate-400 transition-colors group-hover:text-slate-200">
        {{ demo.label }}
      </code>
    </div>
    }
  </div>

  <div class="relative mt-4 rounded-2xl border border-white/[0.08] bg-black/25 px-4 py-3.5">
    <div class="mb-2 flex items-center gap-1.5"><span class="h-2 w-2 rounded-full bg-rose-400/80"></span><span class="h-2 w-2 rounded-full bg-amber-300/80"></span><span class="h-2 w-2 rounded-full bg-emerald-300/80"></span><span class="ml-2 text-[10px] font-medium text-slate-500">component.html</span></div>
    <pre class="overflow-x-auto text-[12px] leading-relaxed"><code
      ><span style="color:#94a3b8">&lt;</span><span style="color:#c084fc">lmn-check</span
      ><br>  <span style="color:#7dd3fc">[animate]</span><span style="color:#94a3b8">=</span><span style="color:#86efac">"true"</span
      ><br>  <span style="color:#7dd3fc">[size]</span><span style="color:#94a3b8">=</span><span style="color:#86efac">"24"</span
      ><br><span style="color:#94a3b8">/&gt;</span></code></pre>
  </div>
</volt-card>
