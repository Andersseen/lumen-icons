<nav aria-label="Page sections">
  <p class="mb-3 text-xs font-semibold uppercase tracking-widest text-muted-foreground">
    On this page
  </p>
  <ul class="space-y-1 border-l border-border text-sm">
    @for (section of sections(); track section.id) {
      <li>
        <a
          [href]="'#' + section.id"
          class="-ml-px block border-l border-transparent py-1 pl-3 text-secondary-foreground transition-colors hover:border-primary hover:text-foreground"
        >
          {{ section.label }}
        </a>
      </li>
    }
  </ul>
</nav>
