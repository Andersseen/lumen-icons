<!--
  volt-card supplies the frame (border, radius, surface tokens, shadow) but its
  card-content / card-footer parts take no inputs and hard-code `p-6`, which a
  150 px catalog tile cannot use. The interior is laid out here instead.
-->
<volt-card
  class="icon-card group h-full overflow-hidden transition-all duration-150 hover:border-primary hover:shadow-md hover:shadow-primary/10"
  (mouseenter)="isHovered.set(true)"
  (mouseleave)="isHovered.set(false)"
>
  <div class="flex h-full min-h-44 flex-col">
    <button
      type="button"
      class="flex w-full min-w-0 flex-1 flex-col items-center justify-center gap-2.5 px-3 pb-2 pt-5 text-center outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-ring"
      [attr.aria-label]="'Copy import for ' + icon().name"
      (click)="copySnippet('import')"
      [moveWhileTap]="{ scale: [1, 0.97] }"
      [moveDuration]="120"
    >
      <span class="icon-inner transition-colors" [class.popped]="popped()">
        @if (isHovered() && iconInputs().animate) {
          <ng-container
            [ngComponentOutlet]="icon().component"
            [ngComponentOutletInputs]="animatedCardInputs()"
          />
        } @else {
          <ng-container
            [ngComponentOutlet]="icon().component"
            [ngComponentOutletInputs]="idleCardInputs()"
          />
        }
      </span>

      <span
        class="block w-full truncate text-sm font-medium text-foreground"
        [voltTooltip]="icon().name"
        [showOnOverflow]="true"
      >
        {{ icon().name }}
      </span>

      <volt-badge variant="secondary">{{ categoryLabel() }}</volt-badge>
    </button>

    <div class="border-t border-border bg-secondary/40">
      <button
        type="button"
        class="flex min-h-9 w-full items-center justify-center gap-1.5 text-[11px] font-medium text-secondary-foreground transition-colors hover:bg-secondary hover:text-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-ring"
        [voltDropdownMenu]="copyMenu"
        [attr.aria-label]="'Copy options for ' + icon().name"
      >
        <lmn-copy [size]="12" [strokeWidth]="2" class="shrink-0" />
        Copy
      </button>
    </div>
  </div>
</volt-card>

<ng-template #copyMenu>
  <volt-dropdown-menu>
    <volt-dropdown-menu-label>{{ icon().name }}</volt-dropdown-menu-label>
    <volt-dropdown-menu-separator />
    <volt-dropdown-menu-item (click)="copySnippet('import')">
      Import statement
    </volt-dropdown-menu-item>
    <volt-dropdown-menu-item (click)="copySnippet('selector')">
      HTML selector
    </volt-dropdown-menu-item>
    <volt-dropdown-menu-item (click)="copySnippet('example')">
      Angular example
    </volt-dropdown-menu-item>
  </volt-dropdown-menu>
</ng-template>
