<div
  class="flex flex-wrap gap-1.5"
  role="radiogroup"
  [attr.aria-label]="ariaLabel()"
>
  @for (s of sizes; track s) {
  <button
    type="button"
    role="radio"
    [attr.aria-checked]="s === size()"
    class="rounded-md px-2.5 py-1 text-sm font-medium transition-colors"
    [class]="s === size()
            ? 'border border-primary bg-primary text-primary-foreground'
            : 'border border-border text-secondary-foreground hover:border-primary hover:text-foreground dark:border-border dark:text-muted-foreground'"
    (click)="size.set(s)"
  >
    {{ s }}
  </button>
  }
</div>
