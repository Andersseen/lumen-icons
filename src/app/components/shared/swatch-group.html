<div class="flex flex-wrap gap-2" role="radiogroup" [attr.aria-label]="ariaLabel()">
  @for (option of options(); track option.value; let i = $index) {
    <button
      type="button"
      role="radio"
      [attr.aria-checked]="value() === option.value"
      [attr.aria-label]="option.label"
      [attr.tabindex]="i === activeIndex() ? 0 : -1"
      class="h-8 w-8 rounded-md border transition-transform hover:scale-105 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring"
      [class]="value() === option.value ? 'border-primary ring-2 ring-primary/30' : 'border-border'"
      [style.background]="option.swatch"
      [voltTooltip]="tooltip"
      [context]="option.label"
      (keydown)="onKeydown($event, i)"
      (click)="value.set(option.value)"
    ></button>
  }
</div>

<ng-template #tooltip let-label>
  <volt-tooltip-content>{{ label }}</volt-tooltip-content>
</ng-template>
